# ── Font ─────────────────────────────────────
font_family GeistMono Nerd Font
font_size 12

# ── Cursor ───────────────────────────────────
cursor_shape block
cursor_blink_interval 0.5

# ── Window ────────────────────────────────────
window_padding_width 12
confirm_os_window_close 0

# ── Scrollback ────────────────────────────────
scrollback_lines 10000

# ── Theme ─────────────────────────────────────
include themes/nightcity.conf

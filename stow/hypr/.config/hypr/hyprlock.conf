# =========================================================
# NIGHT CITY — HYPRLOCK
# =========================================================

# ─────────────────────────────────────────────────────────
# BACKGROUND
# ─────────────────────────────────────────────────────────

background {
    monitor =
    path = ~/Pictures/Wallpapers/v_and_johnny.jpg

    blur_passes = 2
    blur_size = 4

    color = rgba(7, 7, 9, 0.35)
}


# ─────────────────────────────────────────────────────────
# CLOCK
# ─────────────────────────────────────────────────────────

label {
    monitor =
    text = cmd[update:1000] echo "$(date '+%H:%M')"

    color = rgba(232, 227, 216, 1.0)
    font_size = 72
    font_family = GeistMono Nerd Font

    position = 0, 120
    halign = center
    valign = center
}


# ─────────────────────────────────────────────────────────
# DATE
# ─────────────────────────────────────────────────────────

label {
    monitor =
    text = cmd[update:60000] echo "$(date '+%A, %d %B')"

    color = rgba(0, 240, 255, 0.85)
    font_size = 18
    font_family = GeistMono Nerd Font

    position = 0, 45
    halign = center
    valign = center
}


# ─────────────────────────────────────────────────────────
# USER
# ─────────────────────────────────────────────────────────

label {
    monitor =
    text = "NECROGIS"

    color = rgba(255, 59, 48, 0.95)
    font_size = 16
    font_family = GeistMono Nerd Font

    position = 0, -45
    halign = center
    valign = center
}


# ─────────────────────────────────────────────────────────
# PASSWORD
# ─────────────────────────────────────────────────────────

input-field {
    monitor =

    size = 320, 52
    outline_thickness = 2

    inner_color = rgba(7, 7, 9, 0.85)
    outer_color = rgba(255, 59, 48, 0.9)

    font_color = rgb(232, 227, 216)

    fade_on_empty = false

    placeholder_text = <i>ENTER PASSWORD</i>

    position = 0, -120

    halign = center
    valign = center
}


# ─────────────────────────────────────────────────────────
# STATUS
# ─────────────────────────────────────────────────────────

label {
    monitor =
    text = "SYSTEM LOCKED"

    color = rgba(0, 240, 255, 0.65)
    font_size = 12
    font_family = GeistMono Nerd Font

    position = 0, -185
    halign = center
    valign = center
}
